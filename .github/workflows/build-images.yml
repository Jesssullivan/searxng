---
name: Build SearXNG K8s Images

on:
  push:
    branches: [k8s-production-overlay]
    paths:
      - 'container/Dockerfile.k8s'
      - 'container/entrypoint.sh'
      - 'searx/botdetection/ip_limit.py'
      - 'searx/botdetection/valkeydb.py'
      - 'searx/valkeydb.py'
      - 'searx/plugins/pg_cache.py'
      - 'requirements*.txt'
  workflow_dispatch:
    inputs:
      base_tag:
        description: 'SearXNG upstream base image tag'
        default: '2026.3.13-3c1f68c59'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/searxng

jobs:
  build-searxng:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=k8s-latest
            type=sha,prefix=k8s-
            type=raw,value=k8s-{{date 'YYYY.M.DD'}}-{{sha}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile.k8s
          build-args: |
            BASE_TAG=${{ inputs.base_tag || '2026.3.13-3c1f68c59' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`ghcr.io/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Base tag:** \`${{ inputs.base_tag || '2026.3.13-3c1f68c59' }}\`" >> $GITHUB_STEP_SUMMARY
